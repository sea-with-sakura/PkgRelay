cache_dir: ./data

# Trusted LAN clients may register/upload their own package archives before
# safely pruning local caches. Put this service behind network ACLs or TLS in
# a wider deployment.
client_sync:
  enabled: true
  max_upload_bytes: 21474836480

# The gateway owns every installed client's Conda configuration.
client_conda:
  channels: [conda-forge, pytorch, nvidia, defaults]
  channel_priority: strict

sources:
  defaults-main:
    upstreams:
      - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
      - https://repo.anaconda.com/pkgs/main
    metadata_ttl_seconds: 600
    fallback_on_not_found: true

  defaults-r:
    upstreams:
      - https://repo.anaconda.com/pkgs/r
    metadata_ttl_seconds: 600
    fallback_on_not_found: true

  conda-forge:
    upstreams:
      - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
      - https://conda.anaconda.org/conda-forge
    metadata_ttl_seconds: 600
    fallback_on_not_found: true

  pytorch:
    upstreams:
      - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch
      - https://conda.anaconda.org/pytorch
    metadata_ttl_seconds: 600
    fallback_on_not_found: true

  nvidia:
    upstreams:
      - https://conda.anaconda.org/nvidia
    metadata_ttl_seconds: 600
    fallback_on_not_found: true

  pypi:
    kind: pypi
    upstreams:
      - https://pypi.org
    # Every pip install revalidates the per-project Simple index upstream.
    # ETag/Last-Modified normally yields a tiny 304 response when unchanged.
    metadata_ttl_seconds: 0
