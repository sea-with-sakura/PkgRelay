name: pkgrelay

services:
  pkgrelay:
    image: pkgrelay:dev
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:45612:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - pkgrelay-data:/data
    environment:
      PKGRELAY_CACHE_DIR: /data

  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      - pkgrelay
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  # Preserve the existing cache volume while the project is renamed.
  pkgrelay-data:
    external: true
    name: selfcondacache_conda-cache-data
