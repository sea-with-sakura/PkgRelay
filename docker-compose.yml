name: pkgrelay

services:
  pkgrelay:
    image: pkgrelay:dev
    build:
      context: .
      args:
        PKGRELAY_CLIENT_VERSION: ${PKGRELAY_CLIENT_VERSION:-dev}
    restart: unless-stopped
    network_mode: host
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "45612"
      - --proxy-headers
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - /4090data1/pkgrelay/data:/data
    environment:
      PKGRELAY_CACHE_DIR: /data
      PKGRELAY_STATIC_DELIVERY_PORT: "45613"

  static:
    image: pkgrelay:dev
    restart: unless-stopped
    network_mode: host
    command:
      - python
      - -m
      - app.static_server
      - --port
      - "45613"
      - --root
      - /data/files
    volumes:
      - /4090data1/pkgrelay/data:/data:ro
